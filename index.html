      // ====================== MODAL UTILS ======================
      function openModal(id){document.getElementById(id).classList.add("show");}
      function closeModal(id){document.getElementById(id).classList.remove("show");}
      window.onclick=function(e){if(e.target.classList.contains("modal"))e.target.classList.remove("show");};

      // ====================== CONNECTIVITY CHECK ======================
      let lastOnlineState = navigator.onLine;
      let lastPrinterState = null;

      async function checkConnectivity(silent=false) {
        const devices = { billPrinter: false, stickerPrinter: false, barcodeScanner: false };
        
        // Check for printers using Web USB API (for desktop apps)
        if (navigator.usb) {
          try {
            const devices_list = await navigator.usb.getDevices();
            devices_list.forEach(dev => {
              if (dev.productName && dev.productName.toLowerCase().includes('printer')) {
                devices.billPrinter = true;
              }
              if (dev.productName && dev.productName.toLowerCase().includes('label')) {
                devices.stickerPrinter = true;
              }
              if (dev.productName && dev.productName.toLowerCase().includes('scanner') || 
                  dev.productName && dev.productName.toLowerCase().includes('barcode')) {
                devices.barcodeScanner = true;
              }
            });
          } catch(e) { console.log("USB check error:", e); }
        }
        
        // Check network connectivity
        devices.online = navigator.onLine;
        devices.connectionType = navigator.connection ? navigator.connection.effectiveType : 'unknown';
        
        // Store previous state to only notify on change
        const prevOnline = db.printerConfig?.online;
        const prevBillPrinter = db.printerConfig?.billPrinter;
        const prevStickerPrinter = db.printerConfig?.stickerPrinter;
        const prevBarcodeScanner = db.printerConfig?.barcodeScanner;
        
        db.printerConfig = { ...db.printerConfig, ...devices };
        saveData();
        
        // Only show toast if status changed (not on silent or initial load)
        if (!silent && prevOnline !== undefined) {
          if (prevOnline !== devices.online) {
            toast(devices.online ? "✅ Internet connecté" : "⚠️ Internet déconnecté", devices.online ? "success" : "error", 3000);
          }
          if (prevBillPrinter !== devices.billPrinter) {
            toast(devices.billPrinter ? "🖨️ Imprimante de factures connectée" : "⚠️ Imprimante de factures déconnectée", devices.billPrinter ? "success" : "error", 2000);
          }
          if (prevStickerPrinter !== devices.stickerPrinter) {
            toast(devices.stickerPrinter ? "🏷️ Imprimante d'étiquettes connectée" : "⚠️ Imprimante d'étiquettes déconnectée", devices.stickerPrinter ? "success" : "error", 2000);
          }
          if (prevBarcodeScanner !== devices.barcodeScanner) {
            toast(devices.barcodeScanner ? "📷 Lecteur code-barres connecté" : "⚠️ Lecteur code-barres déconnecté", devices.barcodeScanner ? "success" : "error", 2000);
          }
        }
      }
      
      function setupAutoSyncOnOnline() {
        let wasOnline = navigator.onLine;
        
        window.addEventListener('online', async () => {
          if (!wasOnline && db.googleSheetURL) {
            await syncDown(true); // Silent download to get latest data from other devices
            await syncUp(true);   // Silent upload to send local changes
            toast("✅ تم الاتصال بالإنترنت - تمت المزامنة التلقائية", "success", 2000);
          }
          wasOnline = true;
          updateSyncInd();
        });
        
        window.addEventListener('offline', () => {
          if (wasOnline) {
            toast("⚠️ انقطع الاتصال بالإنترنت - وضع عدم الاتصال مفعّل", "error", 3000);
          }
          wasOnline = false;
          updateSyncInd();
        });
        
        // Check connectivity every 30 seconds
        setInterval(() => {
          const isNowOnline = navigator.onLine;
          if (isNowOnline !== wasOnline) {
            if (isNowOnline && db.googleSheetURL) {
              syncDown(true);
              syncUp(true);
            }
            wasOnline = isNowOnline;
            updateSyncInd();
          }
        }, 30000);
        
        // Initial connectivity check on load
        setTimeout(checkConnectivity, 2000);
      }
      
      // ====================== AUTO PRINT WITHOUT POPUP ======================
      function autoPrintReceipt(receiptHTML) {
        // Create a hidden iframe for printing without popup
        const iframe = document.createElement('iframe');
        iframe.style.position = 'fixed';
        iframe.style.right = '0';
        iframe.style.bottom = '0';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = 'none';
        document.body.appendChild(iframe);
        
        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>فاتورة</title>
            <style>
              @media print {
                @page { margin: 0; size: auto; }
                body { margin: 0; padding: 0; }
              }
              body { font-family: 'Tajawal', Arial, sans-serif; direction: rtl; text-align: right; }
              ${receiptHTML}
            </style>
          </head>
          <body onload="window.print(); setTimeout(() => { try { window.parent.document.body.removeChild(window.parent.document.querySelector('iframe')); } catch(e){} }, 1000);">
            ${receiptHTML}
          </body>
          </html>
        `);
        doc.close();
      }
      
      // Enhanced auto-print with direct printer access for desktop apps
      async function autoPrintDirect(receiptHTML) {
        if (navigator.usb && db.printerConfig && db.printerConfig.billPrinter) {
          try {
            const devices_list = await navigator.usb.getDevices();
            const printer = devices_list.find(dev => dev.productName && dev.productName.toLowerCase().includes('printer'));
            if (printer) {
              await printer.open();
              await printer.selectConfiguration(1);
              await printer.claimInterface(0);
              const encoder = new TextEncoder();
              const data = encoder.encode(receiptHTML);
              await printer.transferOut(1, data);
              await printer.close();
              return true;
            }
          } catch(e) { console.log("Direct print error:", e); }
        }
        // Fallback to iframe method
        autoPrintReceipt(receiptHTML);
        return false;
      }
      
      // Auto-sync when internet connection is restored
      async function handleOnlineSync() {
        if (navigator.onLine && db.googleSheetURL) {
          toast("✅ تم الاتصال بالإنترنت - جاري المزامنة التلقائية...", "info", 3000);
          await checkConnectivity();
          await syncUp(true);
        }
      }
      
      // Initialize online event listener for auto-sync
      window.addEventListener('online', handleOnlineSync);
      
      // ====================== STICKER PRINTER FUNCTIONS ======================
      function openStickerModal() {
        const select = document.getElementById('stickerProductSelect');

        select.innerHTML = '<option value="">-- اختر منتج --</option>' +

      function updateStickerPreview() {
        const productId = document.getElementById('stickerProductSelect').value;
        const quantity = parseInt(document.getElementById('stickerQuantity').value) || 1;
        const showName = document.getElementById('showName').checked;
        const showPrice = document.getElementById('showPrice').checked;
        const showBarcode = document.getElementById('showBarcode').checked;
        const showCategory = document.getElementById('showCategory').checked;
        
        const preview = document.getElementById('stickerPreview');
        if (!productId) {
          preview.innerHTML = '<p class="text-gray-400 text-sm">اختر منتج للمعاينة</p>';
          return;
        }
        
        const product = db.products.find(p => p.id == productId);
        if (!product) return;
        
        let stickerContent = '';
        for (let i = 0; i < Math.min(quantity, 5); i++) {
          stickerContent += `
            <div style="border: 1px dashed #ccc; padding: 8px; margin: 4px 0; background: white; font-size: 11px;">
              ${showName ? `<div style="font-weight: bold; margin-bottom: 2px;">${product.name}</div>` : ''}
              ${showBarcode ? `<div style="font-family: monospace; font-size: 13px; letter-spacing: 1px;">${product.barcode}</div>` : ''}
              ${showPrice ? `<div style="font-weight: bold; color: #be185d; margin-top: 2px;">${product.retail} دج</div>` : ''}
              ${showCategory ? `<div style="font-size: 9px; color: #666; margin-top: 1px;">${product.category}</div>` : ''}
            </div>
          `;
        }
        
        if (quantity > 5) {
          stickerContent += `<div style="text-align: center; color: #999; font-size: 10px; margin-top: 4px;">... و ${quantity - 5} ملصقات أخرى</div>`;
        }
        
        preview.innerHTML = stickerContent;
      }
      
      function printStickers() {
        const productId = document.getElementById('stickerProductSelect').value;
        const quantity = parseInt(document.getElementById('stickerQuantity').value) || 1;
        
        if (!productId) {
          toast('⚠️ اختر منتج أولاً', 'error');

        }

        const showPrice = document.getElementById('showPrice').checked;
        const showBarcode = document.getElementById('showBarcode').checked;
        const showCategory = document.getElementById('showCategory').checked;
        
        // Generate sticker HTML
        let stickersHTML = '';
        for (let i = 0; i < quantity; i++) {
          stickersHTML += `
            <div style="page-break-inside: avoid; border: 1px solid #000; padding: 10px; margin: 5px 0; width: 80mm; font-size: 12px; font-family: Arial, sans-serif;">
              ${showName ? `<div style="font-weight: bold; margin-bottom: 3px; font-size: 14px;">${product.name}</div>` : ''}
              ${showBarcode ? `<div style="font-family: 'Courier New', monospace; font-size: 16px; letter-spacing: 2px; text-align: center; margin: 5px 0;">${product.barcode}</div>` : ''}
              ${showPrice ? `<div style="font-weight: bold; color: #be185d; font-size: 16px; text-align: right; margin-top: 3px;">${product.retail} دج</div>` : ''}
              ${showCategory ? `<div style="font-size: 10px; color: #666; margin-top: 2px;">${product.category}</div>` : ''}
            </div>
          `;
        }
        
        // Create hidden iframe for printing
        const iframe = document.createElement('iframe');
        iframe.style.position = 'fixed';
        iframe.style.right = '0';
        iframe.style.bottom = '0';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = 'none';
        document.body.appendChild(iframe);
        
        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>ملصقات الباركود - ${product.name}</title>
            <style>
              @media print {
                @page { margin: 10mm; size: auto; }
                body { margin: 0; padding: 0; }
              }
              body { font-family: Arial, sans-serif; }
            </style>
          </head>
          <body>
            ${stickersHTML}
            <script>
              window.onload = function() {
                window.print();
                setTimeout(function() { document.body.parentNode.removeChild(document.body); }, 1000);
              };
            <\/script>
          </body>
          </html>
        `);
        doc.close();
        
        closeModal('stickerModal');
        toast(`✅ جاري طباعة ${quantity} ملصق`, 'success');
      }
      
      setInterval(updateSyncInd, 60000);
      document.addEventListener("gesturestart",e=>e.preventDefault());
    </script>
