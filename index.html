<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#be185d" />
    <meta name="description" content="نظام نقطة بيع متجر الهدايا الذهبي" />
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoi4KmF2YTYhdCw2Kkg2Kqg2KfZhCDYp9mE2YjZitixINio2YrYsdmG2YgiLCJzaG9ydF9uYW1lIjoi4KmF2YTYhdCw2KkgIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzFhMDUzMyIsInRoZW1lX2NvbG9yIjoiI2JlMTg1ZCIsImljb25zIjpbeyJzcmMiOiJodHRwczovL3VpLmhlcm9pY29ucy5jb20vMS4wL3N2Zy8yNC9zb2xpZC9naWZ0LnN2ZyIsInNpemVzIjoiMTkyeDE5MiIsInR5cGUiOiJpbWFnZS9zdmciLCJwdXJwb3NlIjoiYW55IG1hc2thYmxlIn1dfQ==" />
    <title>متجر الهدايا الذهبي - POS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap");
      * {
        -webkit-tap-highlight-color: transparent;
        font-family: "Tajawal", sans-serif;
        box-sizing: border-box;
      }
      body {
        background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #f3e8ff 100%);
        min-height: 100vh;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      @media (max-width: 640px) {
        html { font-size: 14px; }
      }
      .pin-box {
        letter-spacing: 0.5em;
        font-size: clamp(1.5rem, 5vw, 2rem);
      }
      .step {
        font-size: clamp(0.75rem, 2vw, 0.875rem);
        padding: 0.5rem 1rem;
        transition: all 0.3s;
      }
      .step-active {
        background: linear-gradient(135deg, #be185d, #9333ea) !important;
        color: white !important;
      }
      .sidebar {
        width: 270px;
        transition: transform 0.3s ease;
        background: linear-gradient(180deg, #1a0533 0%, #2d1b69 50%, #1e0a3c 100%);
        flex-shrink: 0;
        overflow-y: auto;
      }
      @media (max-width: 1024px) {
        .sidebar {
          position: fixed;
          right: auto;
          left: 0;
          top: 0;
          height: 100vh;
          z-index: 40;
          transform: translateX(-100%);
        }
        .sidebar.open { transform: translateX(0); }
      }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 39;
      }
      .sidebar-overlay.active { display: block; }
      .sidebar-item {
        padding: 0.75rem 1.25rem;
        margin-bottom: 0.35rem;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.25s;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.95rem;
        color: #e9d5ff;
        user-select: none;
      }
      .sidebar-item:hover {
        background: rgba(236, 72, 153, 0.3);
        color: white;
      }
      .sidebar-item.active {
        background: linear-gradient(135deg, rgba(236, 72, 153, 0.6), rgba(147, 51, 234, 0.6));
        color: white;
        font-weight: bold;
        border-right: 3px solid #f472b6;
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 50;
        inset: 0;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        padding: 1rem;
        align-items: center;
        justify-content: center;
      }
      .modal.show { display: flex; }
      .modal-content {
        background: white;
        margin: auto;
        padding: 0;
        border-radius: 24px;
        width: 100%;
        max-width: 600px;
        box-shadow: 0 25px 60px rgba(190, 24, 93, 0.3);
        animation: slideDown 0.3s ease-out;
        max-height: 90vh;
        overflow-y: auto;
      }
      @keyframes slideDown {
        from { transform: translateY(-40px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .gift-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(190, 24, 93, 0.08);
        border: 1px solid rgba(236, 72, 153, 0.12);
        transition: all 0.3s;
      }
      .gift-card:hover {
        box-shadow: 0 8px 30px rgba(190, 24, 93, 0.12);
      }
      .product-quick-card {
        background: linear-gradient(135deg, #fff0f9, #fdf4ff);
        border: 2px solid rgba(236, 72, 153, 0.15);
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
        user-select: none;
      }
      .product-quick-card:hover {
        background: linear-gradient(135deg, #fce7f3, #f3e8ff);
        border-color: #ec4899;
        transform: scale(1.02);
      }
      .product-quick-card:active { transform: scale(0.97); }
      .product-quick-card.out-of-stock {
        opacity: 0.4;
        cursor: not-allowed;
        pointer-events: none;
      }
      .stat-card {
        background: linear-gradient(135deg, var(--from), var(--to));
        color: white;
        padding: 1.25rem;
        border-radius: 1.25rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      }
      .sync-success { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 1rem; border-radius: 12px; margin-top: 0.75rem; font-weight: 600; }
      .sync-error { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; padding: 1rem; border-radius: 12px; margin-top: 0.75rem; font-weight: 600; }
      .sync-loading { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 1rem; border-radius: 12px; margin-top: 0.75rem; font-weight: 600; animation: pulse 1.5s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
      .mobile-menu-btn {
        display: none;
        position: fixed;
        bottom: 1.5rem;
        left: 1.5rem;
        z-index: 50;
        background: linear-gradient(135deg, #be185d, #9333ea);
        color: white;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 50%;
        box-shadow: 0 6px 20px rgba(190, 24, 93, 0.4);
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        border: none;
        cursor: pointer;
      }
      @media (max-width: 1024px) { .mobile-menu-btn { display: flex; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .float-icon { animation: float 3s ease-in-out infinite; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #f9e8f5; }
      ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 3px; }
      @media print {
        body * { visibility: hidden; }
        #receipt, #receipt * { visibility: visible; }
        #receipt { position: absolute; left: 0; top: 0; width: 300px; }
        @page { margin: 0; size: auto; }
      }
      .print-hidden { display: none !important; }
      @page { margin: 0.5cm; size: auto; }
      .setup-link-box { background: linear-gradient(135deg, #ec4899, #9333ea); padding: 1rem; border-radius: 1rem; word-break: break-all; color: white; }
      .loading-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; z-index: 9999; }
      .loading-box { background: white; padding: 30px; border-radius: 24px; text-align: center; max-width: 400px; }
      .toast-container {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        pointer-events: none;
        width: 92%;
        max-width: 420px;
      }
      .toast {
        padding: 0.85rem 1.25rem;
        border-radius: 14px;
        color: white;
        font-weight: 700;
        font-size: 0.9rem;
        text-align: center;
        animation: toastIn 0.35s ease-out;
        pointer-events: auto;
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      }
      .toast-success { background: linear-gradient(135deg, #10b981, #059669); }
      .toast-error { background: linear-gradient(135deg, #ef4444, #dc2626); }
      .toast-info { background: linear-gradient(135deg, #3b82f6, #2563eb); }
      @keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }
      .main-layout { display: flex; min-height: 100vh; }
      .main-content-area {
        flex: 1;
        min-width: 0;
        padding: 1rem;
        overflow-x: hidden;
        overflow-y: auto;
        max-height: 100vh;
      }
      @media (min-width: 640px) { .main-content-area { padding: 1.5rem; } }
      @media (min-width: 1024px) { .main-content-area { padding: 2rem; } }
      @media (max-width: 768px) {
        table { font-size: 0.7rem; }
        th, td { padding: 0.4rem !important; }
      }
      .pos-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
      @media (min-width: 1024px) { .pos-grid { grid-template-columns: 1.4fr 1fr; gap: 1.5rem; } }
      .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
      @media (min-width: 640px) { .quick-grid { grid-template-columns: repeat(3, 1fr); gap: 0.6rem; } }
      .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      @media (min-width: 1024px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
      .two-col { display: grid; grid-template-columns: 1fr; gap: 1rem; }
      @media (min-width: 1024px) { .two-col { grid-template-columns: 1fr 1fr; gap: 1.5rem; } }
      .three-col { display: grid; grid-template-columns: 1fr; gap: 1rem; }
      @media (min-width: 768px) { .three-col { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1024px) { .three-col { grid-template-columns: repeat(3, 1fr); } }
      .btn-primary {
        background: linear-gradient(135deg, #be185d, #9333ea);
        color: white; border: none; cursor: pointer;
        font-weight: 700; border-radius: 1rem; transition: opacity 0.2s;
        font-family: "Tajawal", sans-serif;
      }
      .btn-primary:hover { opacity: 0.9; }
      .btn { border: none; cursor: pointer; font-family: "Tajawal", sans-serif; }
      input, select, textarea { font-family: "Tajawal", sans-serif; }
    </style>
  </head>
  <body>
    <div class="toast-container" id="toastContainer"></div>

    <button id="mobileMenuBtn" class="mobile-menu-btn" onclick="toggleMobileSidebar()">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleMobileSidebar()"></div>

    <!-- Setup Screen -->
    <div id="setupScreen" class="min-h-screen hidden flex items-center justify-center p-4"
      style="background: linear-gradient(135deg, #1a0533 0%, #be185d 50%, #9333ea 100%);">
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden">
        <div class="p-6 text-center" style="background: linear-gradient(135deg, #be185d, #9333ea)">
          <div class="text-5xl mb-3 float-icon">🎁</div>
          <h1 class="text-2xl sm:text-3xl font-bold text-white">مرحباً بك في متجر الهدايا</h1>
          <p class="mt-2 text-pink-200 text-sm">إعداد نظام نقطة البيع</p>
        </div>
        <div class="flex flex-wrap justify-center px-4 sm:px-8 pt-6 gap-2">
          <div id="step1" class="step rounded-full cursor-pointer step-active">1. المتجر</div>
          <div id="step2" class="step rounded-full cursor-pointer bg-gray-100">2. المدير</div>
          <div id="step3" class="step rounded-full cursor-pointer bg-gray-100">3. المزامنة</div>
        </div>
        <div class="p-4 sm:p-8" id="setupContent"></div>
        <div class="flex flex-col sm:flex-row justify-between gap-3 p-4 sm:p-6 border-t">
          <button onclick="prevStep()" class="btn px-6 py-3 text-gray-600 hover:bg-gray-100 rounded-2xl order-2 sm:order-1 bg-transparent">السابق</button>
          <button onclick="nextStep()" class="px-8 py-3 btn-primary order-1 sm:order-2">التالي ✨</button>
        </div>
      </div>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen hidden flex items-center justify-center p-4"
      style="background: linear-gradient(135deg, #1a0533 0%, #be185d 50%, #9333ea 100%);">
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-6 sm:p-8">
        <div class="text-center mb-6">
          <div class="text-6xl mb-4 float-icon">🎁</div>
          <h1 class="text-2xl sm:text-3xl font-bold bg-clip-text text-transparent"
            style="background: linear-gradient(135deg, #be185d, #9333ea); -webkit-background-clip: text;"
            id="shopNameDisplay">متجر الهدايا</h1>
          <p class="text-gray-500 mt-2 text-sm">أدخل كودك للدخول</p>
        </div>
        <div class="mb-6">
          <input type="password" id="pinInputDirect" maxlength="6" inputmode="numeric" autocomplete="off"
            placeholder="● ● ● ● ● ●"
            class="w-full text-center text-2xl sm:text-4xl tracking-widest py-4 sm:py-5 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 pin-box bg-pink-50"
            onkeypress="if(event.key==='Enter')verifyLoginDirect();" />
        </div>
        <button onclick="verifyLoginDirect()" class="w-full py-4 btn-primary text-lg shadow-lg mb-4">
          <i class="fa-solid fa-right-to-bracket"></i> دخول
        </button>
        <div class="text-center">
          <button onclick="showPinPad()" class="btn text-pink-600 text-sm hover:underline bg-transparent">🔢 لوحة الأرقام</button>
        </div>
        <div id="pinPadSection" class="hidden mt-6">
          <input type="text" id="pinInput" maxlength="6" readonly
            class="w-full text-center text-3xl tracking-widest py-4 border-2 border-pink-200 rounded-2xl mb-4 pin-box bg-pink-50" placeholder="••••••" />
          <div class="grid grid-cols-3 gap-2 mb-4" id="pinPad"></div>
          <div class="flex gap-3">
            <button onclick="clearPin()" class="btn flex-1 py-3 bg-gray-100 rounded-xl font-semibold text-gray-700">مسح</button>
            <button onclick="verifyLoginPad()" class="flex-1 py-3 btn-primary">دخول</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden">
      <div class="main-layout">
        <div id="sidebar" class="sidebar text-white p-4 flex flex-col" style="min-height:100vh">
          <div class="text-center mb-6 pb-4 border-b border-purple-700">
            <div class="text-3xl mb-2 float-icon">🎁</div>
            <div class="text-base font-bold text-pink-300" id="sidebarShopName">متجر الهدايا</div>
            <div class="text-xs text-purple-400">نظام نقطة البيع</div>
          </div>
          <div class="flex-1 overflow-y-auto space-y-1" id="sidebarNav"></div>
          <div class="mt-auto rounded-2xl p-3" style="background:rgba(255,255,255,0.1)">
            <div id="currentUserDisplay" class="text-xs mb-2"></div>
            <div id="syncIndicator" class="text-xs text-purple-300 mb-2"></div>
            <button onclick="logout()" class="btn w-full bg-red-600 hover:bg-red-700 py-2 rounded-xl text-xs font-semibold text-white">
              <i class="fa-solid fa-right-from-bracket"></i> خروج
            </button>
          </div>
        </div>
        <div class="main-content-area" id="mainContent"></div>
      </div>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
      <div class="modal-content">
        <div class="p-4 sm:p-6 rounded-t-3xl flex justify-between items-center" style="background:linear-gradient(135deg,#be185d,#9333ea)">
          <h3 class="text-lg font-bold text-white" id="modalProductTitle">🎁 إضافة منتج</h3>
          <button onclick="closeModal('productModal')" class="btn text-white hover:text-pink-200 text-2xl bg-transparent">&times;</button>
        </div>
        <div class="p-4 sm:p-6">
          <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="prodId" />
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
              <div class="sm:col-span-2">
                <label class="block text-sm font-semibold mb-1 text-gray-700">اسم المنتج</label>
                <input type="text" id="prodName" required class="w-full p-3 border-2 border-pink-100 rounded-xl focus:border-pink-400 outline-none" />
              </div>
              <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">الباركود</label>
                <input type="text" id="prodBarcode" class="w-full p-3 border-2 border-pink-100 rounded-xl outline-none" />
              </div>
              <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">الفئة</label>
                <select id="prodCategory" class="w-full p-3 border-2 border-pink-100 rounded-xl bg-white">
                  <option value="هدايا">هدايا</option><option value="تغليف">تغليف</option><option value="بطاقات">بطاقات</option>
                  <option value="ديكور">ديكور</option><option value="ألعاب">ألعاب</option><option value="حلويات">حلويات</option><option value="أخرى">أخرى</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">وحدة البيع</label>
                <select id="prodUnit" class="w-full p-3 border-2 border-pink-100 rounded-xl bg-white">
                  <option value="piece">قطعة</option><option value="box">علبة</option><option value="pack">طقم</option><option value="set">مجموعة</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">المخزون</label>
                <input type="number" id="prodStock" required class="w-full p-3 border-2 border-pink-100 rounded-xl outline-none" />
              </div>
              <div class="sm:col-span-2 grid grid-cols-3 gap-2 mt-2">
                <div><label class="block text-xs text-gray-500 mb-1">التكلفة (دج)</label><input type="number" step="0.01" id="prodCost" class="w-full p-2 border-2 border-gray-100 rounded-lg bg-gray-50 outline-none" /></div>
                <div><label class="block text-xs text-gray-500 mb-1">الجملة (دج)</label><input type="number" step="0.01" id="prodWholesale" class="w-full p-2 border-2 border-gray-100 rounded-lg bg-gray-50 outline-none" /></div>
                <div><label class="block text-xs text-pink-600 font-bold mb-1">التجزئة (دج)</label><input type="number" step="0.01" id="prodRetail" required class="w-full p-2 border-2 border-pink-300 rounded-lg bg-pink-50 font-bold outline-none" /></div>
              </div>
            </div>
            <div class="flex gap-3 mt-6">
              <button type="button" onclick="closeModal('productModal')" class="btn flex-1 py-3 bg-gray-100 rounded-xl font-semibold text-gray-700">إلغاء</button>
              <button type="submit" class="flex-1 py-3 btn-primary">💾 حفظ</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Debt Modal -->
    <div id="debtModal" class="modal">
      <div class="modal-content">
        <div class="p-4 sm:p-6 rounded-t-3xl flex justify-between items-center" style="background:linear-gradient(135deg,#ea580c,#dc2626)">
          <h3 class="text-lg font-bold text-white">📝 تسجيل دين</h3>
          <button onclick="closeModal('debtModal')" class="btn text-white text-2xl bg-transparent">&times;</button>
        </div>
        <div class="p-4 sm:p-6">
          <form id="debtForm" onsubmit="saveDebt(event)">
            <div class="mb-4"><label class="block text-sm font-semibold mb-1">اسم المدين</label><input type="text" id="debtCustomer" required class="w-full p-3 border-2 border-orange-100 rounded-xl outline-none" /></div>
            <div class="mb-4"><label class="block text-sm font-semibold mb-1">رقم الهاتف</label><input type="tel" id="debtPhone" placeholder="0555123456" class="w-full p-3 border-2 border-orange-100 rounded-xl outline-none" /></div>
            <div class="mb-4"><label class="block text-sm font-semibold mb-1">المبلغ (دج)</label><input type="number" id="debtAmount" readonly class="w-full p-3 border-2 border-orange-100 rounded-xl bg-orange-50 font-bold text-xl" /></div>
            <div class="flex gap-3 mt-6">
              <button type="button" onclick="closeModal('debtModal')" class="btn flex-1 py-3 bg-gray-100 rounded-xl font-semibold">إلغاء</button>
              <button type="submit" class="btn flex-1 py-3 bg-orange-600 text-white rounded-xl font-semibold">تسجيل</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Supplier Modal -->
    <div id="supplierModal" class="modal">
      <div class="modal-content">
        <div class="p-4 sm:p-6 rounded-t-3xl flex justify-between items-center" style="background:linear-gradient(135deg,#2563eb,#1d4ed8)">
          <h3 class="text-lg font-bold text-white" id="modalSupplierTitle">🚚 إضافة مورد</h3>
          <button onclick="closeModal('supplierModal')" class="btn text-white text-2xl bg-transparent">&times;</button>
        </div>
        <div class="p-4 sm:p-6">
          <form id="supplierForm" onsubmit="saveSupplier(event)">
            <input type="hidden" id="supplierId" />

    <script>
      // ====================== DATA ======================
      let db = {
        setupCompleted: false, shopName: "متجر الهدايا الذهبي",
        manager: { name: "", pin: "", phone: "" }, workers: [], products: [],
        sales: [], debts: [], suppliers: [], purchases: [], transactions: [],
        cashRegister: 0, nextInvoice: 1001, googleSheetURL: "",
        lastSyncTime: null, autoSyncEnabled: false, currentUser: null,
        printerConfig: { billPrinter: null, stickerPrinter: null, barcodeScanner: null }
      };
      let currentStep = 1;
      let setupData = { shopName: "", managerName: "", managerPin: "", googleURL: "" };
      let currentPin = "";
      let cart = [];
      let syncInterval = null;
      let activePage = 0;
      const CURRENCY = "دج";
      const CAT_EMOJI = {"هدايا":"🎁","ألعاب":"🧸","بطاقات":"💌","حلويات":"🍫","ديكور":"🎀","تغليف":"📦","أخرى":"✨"};

      const NAV_ITEMS = [
        { icon: "fa-cash-register", color: "text-pink-400", label: "نقطة البيع" },
        { icon: "fa-gift", color: "text-purple-400", label: "المنتجات" },
        { icon: "fa-users", color: "text-blue-400", label: "الديون" },
        { icon: "fa-truck", color: "text-yellow-400", label: "الموردين" },
        { icon: "fa-chart-bar", color: "text-green-400", label: "التقارير" },
        { icon: "fa-wallet", color: "text-orange-400", label: "الخزنة" },
        { icon: "fa-sync", color: "text-cyan-400", label: "المزامنة" },
        { icon: "fa-user-tie", color: "text-red-400", label: "المدير" }
      ];

      // ====================== EMPLOYEE TRACKER DATA ======================
      function getEmployeeStats() {
        const stats = {};
        const now = Date.now();
        const fiveMinAgo = now - (5 * 60 * 1000);
        
        // Initialize stats for all workers
        db.workers.forEach(w => {
          stats[w.id] = {
            id: w.id,
            name: w.name,
            role: w.role,
            salesCount: 0,
            totalRevenue: 0,
            lastActivity: w.lastActivity || null,
            isActive: w.lastActivity && (now - new Date(w.lastActivity).getTime()) < fiveMinAgo
          };
        });
        
        // Add manager stats
        if (db.manager && db.manager.name) {
          stats['manager'] = {
            id: 'manager',
            name: db.manager.name,
            role: 'مدير',
            salesCount: 0,
            totalRevenue: 0,
            lastActivity: db.manager.lastActivity || null,
            isActive: db.manager.lastActivity && (now - new Date(db.manager.lastActivity).getTime()) < fiveMinAgo
          };
        }
        
        // Calculate stats from sales
        db.sales.forEach(sale => {
          const sellerId = sale.sellerId;
          if (sellerId && stats[sellerId]) {
            stats[sellerId].salesCount++;
            stats[sellerId].totalRevenue += n(sale.total);
          }
        });
        
        return Object.values(stats);
      }

      // ====================== HELPERS ======================
      function saveData() { 
        try { 
          // No encryption - save PINs as plain text
          localStorage.setItem("giftShopDB", JSON.stringify(db)); 
        } catch(e) {} 
      }
      
      // ====================== UTILS (NO ENCRYPTION) ======================
      // Encryption disabled for cross-device compatibility - PINs stored in plain text
      function encryptPIN(pin) { return pin; }
      function decryptPIN(encryptedPin) { return encryptedPin; }
      
      function n(v) { const x = parseFloat(v); return isNaN(x) ? 0 : x; }
      function fmtDate(d) { try { return new Date(d).toLocaleString("ar-DZ",{dateStyle:"short",timeStyle:"short"}); } catch(e) { return d||""; } }

      // ====================== TOAST ======================
      function toast(msg, type="success", dur=3000) {
        const c = document.getElementById("toastContainer");
        const t = document.createElement("div");
        t.className = `toast toast-${type}`;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => { t.style.animation = "toastOut 0.3s forwards"; setTimeout(() => t.remove(), 300); }, dur);
      }

      // ====================== SOUNDS ======================
      const ACtx = window.AudioContext || window.webkitAudioContext;
      function beep(f,tp,d,v) { try { const c=new ACtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type=tp;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+d);o.start();o.stop(c.currentTime+d); } catch(e){} }
      function sndOk() { [523,659,784].forEach((f,i) => setTimeout(()=>beep(f,"sine",0.2,0.2),i*120)); }
      function sndErr() { beep(200,"sawtooth",0.3,0.2); }
      function sndClick() { beep(800,"sine",0.08,0.08); }

      // ====================== TRANSACTIONS ======================
      function addTx(type, desc, amt) {
        amt = n(amt);
        if (type==="in") db.cashRegister += amt;
        else if (type==="out") db.cashRegister -= amt;
        db.transactions.push({ id:Date.now(), date:new Date().toISOString(), type, description:desc, amount:amt, balanceAfter:db.cashRegister, user:db.currentUser?db.currentUser.name:"النظام" });
        saveData();
      }

      // ====================== SIDEBAR NAV ======================
      function buildSidebar() {
        const nav = document.getElementById("sidebarNav");
        if (!nav) return;
        const isManager = db.currentUser?.type === "manager";
        // Hide admin-only items from non-managers: Cash(5), Sync(6), Manager(7)
        nav.innerHTML = NAV_ITEMS.map((item, i) => {
          // Hide Cash, Sync, Manager from non-managers
          if(!isManager && (i===5 || i===6 || i===7)) return '';
          return `<div class="sidebar-item ${i===activePage?'active':''}" data-page="${i}" onclick="navClick(${i})">
            <i class="fa-solid ${item.icon} ${item.color}"></i><span>${item.label}</span>
          </div>`;
        }).filter(x=>x).join("");
      }

      function navClick(pg) {
        activePage = pg;
        buildSidebar();
        closeMobileSidebar();
        loadPage(pg);
      }

      // ====================== INIT ======================
      window.onload = async () => {
        const params = new URLSearchParams(window.location.search);
        const sheetURL = params.get("sheet");
        const autoSetup = params.get("autoSetup");
        const saved = localStorage.getItem("giftShopDB");
        if (saved) { 
          try { 
            const loadedData = JSON.parse(saved);
            db = { ...db, ...loadedData };
            // No decryption needed - PINs are plain text
          } catch(e){} 
        }
        ["products","sales","debts","suppliers","workers","purchases","transactions"].forEach(k => { if(!Array.isArray(db[k])) db[k]=[]; });
        if (!db.manager) db.manager = {name:"",pin:"",phone:""};
        if (!db.cashRegister) db.cashRegister = 0;

        checkConnectivity();
        setupAutoSyncOnOnline();

        // Handle QR code configuration - FIXED: PINs now stored in plain text
        const configParam = params.get("config");
        if (configParam) {
          try {
            const decodedConfig = decodeURIComponent(atob(configParam));
            const configData = JSON.parse(decodedConfig);
            
            if (confirm("🔗 إعداد تلقائي من جهاز آخر\n\nالمتجر: " + (configData.shopName||'غير معروف') + "\nالمدير: " + (configData.managerName||'غير معروف') + "\n\nهل تريد تطبيق هذه الإعدادات؟")) {
              db.shopName = configData.shopName || db.shopName;
              db.googleSheetURL = configData.googleSheetURL || db.googleSheetURL;
              db.autoSyncEnabled = configData.autoSyncEnabled !== false;
              db.setupCompleted = true;
              
              // Apply manager PIN (already encrypted, just copy it)
              if (configData.managerPin) {
                db.manager = {
                  name: configData.managerName || db.manager.name,
                  pin: configData.managerPin, // Keep encrypted form
                  phone: db.manager.phone || ""
                };
              } else if (configData.managerName) {
                db.manager.name = configData.managerName;
              }
              
              // Apply workers with their encrypted PINs
              if (configData.workers && Array.isArray(configData.workers)) {
                db.workers = configData.workers.map(w => ({
                  id: Date.now() + Math.random(),
                  name: w.name || "",
                  pin: w.pin || "", // Keep encrypted form
                  role: w.role || "موظف"
                }));
              }
              
              saveData();
              
              if (db.googleSheetURL) {
                await syncUp(true);
              }
              
              toast("✅ تم الإعداد التلقائي بنجاح مع جميع كلمات المرور", "success", 4000);
              showLogin();
              return;
            }
          } catch(e) {
            console.error("Config error:", e);
            toast("⚠️ رمز QR غير صالح", "error");
          }
        }

        if (sheetURL && autoSetup==="true" && !db.setupCompleted) { await quickSetup(sheetURL); return; }
        if (sheetURL && db.setupCompleted) { db.googleSheetURL=decodeURIComponent(sheetURL); saveData(); toast("✅ تم تحديث رابط المزامنة"); showLogin(); return; }
        if (!db.setupCompleted) { document.getElementById("setupScreen").classList.remove("hidden"); showSetupStep(1); }
        else showLogin();
      };

      async function quickSetup(url) {
        db.googleSheetURL = decodeURIComponent(url);
        const ov = document.createElement("div"); ov.className="loading-overlay";
        ov.innerHTML = `<div class="loading-box"><div style="font-size:50px" class="float-icon">☁️</div><h3 style="font-size:18px;font-weight:700;color:#be185d;margin-top:12px">جاري التحميل...</h3></div>`;
        document.body.appendChild(ov);
        try {
          const r = await fetch(db.googleSheetURL+"?action=get"); const d = await r.json();
          if (d.status==="success" && d.hasData) {
            Object.assign(db, { setupCompleted:true, shopName:d.shopName||db.shopName, manager:{name:d.manager?.name||"",pin:String(d.manager?.pin||""),phone:d.manager?.phone||""}, cashRegister:n(d.cashRegister), nextInvoice:d.nextInvoice||1001 });
            ["products","sales","debts","suppliers","workers","purchases","transactions"].forEach(k => { if(d[k]) db[k]=d[k]; });
            saveData(); ov.remove(); toast(`✅ تم استعادة ${db.products.length} منتج`); showLogin(); return;
          }
        } catch(e) { console.log("No cloud data"); }
        ov.remove();
        // Default setup with plain text PIN (will be encrypted on save)
        db.setupCompleted=true; 
        db.shopName="متجر الهدايا الذهبي"; 
        db.manager={name:"المدير",pin:"123456",phone:""};
        db.products = defProducts(); 
        db.suppliers=[{id:1,name:"مورد الهدايا",phone:"0551234567",address:"",totalPurchases:0}];
        saveData(); 
        await syncUp(true); 
        toast("✅ كود المدير الافتراضي: 123456<br><small>يمكن تغييره من لوحة المدير</small>","success",6000); 
        showLogin();
      }

      function defProducts() {
        return [
          {id:1,name:"علبة هدية فاخرة",barcode:"G001",cost:500,retail:950,wholesale:750,stock:50,category:"هدايا",unit:"piece"},
          {id:2,name:"دمية أفخم",barcode:"G002",cost:800,retail:1500,wholesale:1200,stock:30,category:"ألعاب",unit:"piece"},
          {id:3,name:"بطاقة معايدة",barcode:"G003",cost:50,retail:150,wholesale:100,stock:200,category:"بطاقات",unit:"piece"},
          {id:4,name:"شوكولاتة هدية",barcode:"G004",cost:600,retail:1200,wholesale:950,stock:80,category:"حلويات",unit:"box"},
          {id:5,name:"طقم عطر",barcode:"G005",cost:1500,retail:3000,wholesale:2400,stock:20,category:"هدايا",unit:"set"}
        ];
      }

      function toggleMobileSidebar() { document.getElementById("sidebar").classList.toggle("open"); document.getElementById("sidebarOverlay").classList.toggle("active"); }
      function closeMobileSidebar() { document.getElementById("sidebar").classList.remove("open"); document.getElementById("sidebarOverlay").classList.remove("active"); }

      // ====================== SETUP ======================
      function showSetupStep(s) {
        currentStep=s;
        for(let i=1;i<=3;i++) { const el=document.getElementById("step"+i); el.className = i===s ? "step rounded-full cursor-pointer step-active" : "step rounded-full cursor-pointer bg-gray-100 text-gray-600"; }
        const c=document.getElementById("setupContent");
        const cls="w-full p-3 sm:p-4 border-2 border-pink-100 rounded-2xl text-lg focus:outline-none focus:border-pink-400";
        if(s===1) c.innerHTML=`<h2 class="text-xl font-bold mb-4 text-gray-800">🎁 اسم المتجر</h2><input id="shopNameInput" type="text" value="${setupData.shopName||'متجر الهدايا الذهبي'}" class="${cls}"/>`;
        else if(s===2) c.innerHTML=`<h2 class="text-xl font-bold mb-4 text-gray-800">👤 حساب المدير</h2><input id="managerNameInput" type="text" placeholder="اسم المدير" value="${setupData.managerName}" class="${cls} mb-4"/><input id="managerPinInput" type="text" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="الكود السري (4+ أرقام)" class="${cls} text-center text-2xl tracking-widest"/>`;
        else c.innerHTML=`<h2 class="text-xl font-bold mb-4 text-gray-800">☁️ المزامنة (اختياري)</h2><p class="text-gray-500 text-sm mb-4">أضف رابط Google Apps Script</p><input id="googleURLInput" type="url" placeholder="https://script.google.com/macros/s/..." value="${setupData.googleURL}" class="w-full p-3 border-2 border-pink-100 rounded-2xl text-xs focus:outline-none"/>`;
      }
      function nextStep() {
        if(currentStep===1) { setupData.shopName=document.getElementById("shopNameInput").value.trim(); showSetupStep(2); }
        else if(currentStep===2) { const nm=document.getElementById("managerNameInput").value.trim(),p=document.getElementById("managerPinInput").value.trim(); if(!nm||!p||p.length<4){toast("أدخل اسم وكود 4+ أرقام","error");return;} setupData.managerName=nm;setupData.managerPin=p; showSetupStep(3); }
        else { setupData.googleURL=document.getElementById("googleURLInput")?.value.trim()||""; finishSetup(); }
      }
      function prevStep() { if(currentStep>1) showSetupStep(currentStep-1); }
      function finishSetup() {
        if(!setupData.managerPin){toast("يجب إعداد المدير","error");return;}
        Object.assign(db,{setupCompleted:true,shopName:setupData.shopName||"متجر الهدايا الذهبي",manager:{name:setupData.managerName,pin:setupData.managerPin,phone:""},googleSheetURL:setupData.googleURL,cashRegister:0});
        db.products=defProducts(); db.suppliers=[{id:1,name:"مورد الهدايا",phone:"0551234567",address:"",totalPurchases:0}];
        saveData(); toast("✅ تم الإعداد بنجاح!"); document.getElementById("setupScreen").classList.add("hidden"); showLogin();
      }

      // ====================== LOGIN ======================
      function showLogin() { 
        document.getElementById("loginScreen").classList.remove("hidden"); 
        document.getElementById("shopNameDisplay").textContent = db.shopName; 
        // Clear any previous input
        const pinInput = document.getElementById("pinInputDirect");
        if (pinInput) {
          pinInput.value = "";
          pinInput.focus();
        }
        setTimeout(() => {
          const p = document.getElementById("pinInputDirect");
          if (p) p.focus();
        }, 300); 
      }
      function showPinPad() { const s=document.getElementById("pinPadSection"); s.classList.toggle("hidden"); if(!s.classList.contains("hidden")) createPinPad(); }
      function createPinPad() {
        const p=document.getElementById("pinPad"); if(!p)return; p.innerHTML="";
        for(let i=1;i<=9;i++) p.innerHTML+=`<button onclick="addPin('${i}')" type="button" class="btn py-3 text-xl font-bold rounded-2xl" style="background:linear-gradient(135deg,#fdf2f8,#f3e8ff);color:#be185d;">${i}</button>`;
        p.innerHTML+=`<div></div><button onclick="addPin('0')" type="button" class="btn py-3 text-xl font-bold rounded-2xl" style="background:linear-gradient(135deg,#fdf2f8,#f3e8ff);color:#be185d;">0</button><button onclick="backspacePin()" type="button" class="btn py-3 text-xl font-bold rounded-2xl bg-red-50 text-red-600">⌫</button>`;
      }
      function addPin(num) { if(currentPin.length<6){currentPin+=num;document.getElementById("pinInput").value="●".repeat(currentPin.length);sndClick();} }
      function clearPin() { currentPin=""; document.getElementById("pinInput").value=""; }
      function backspacePin() { if(currentPin.length>0){currentPin=currentPin.slice(0,-1);document.getElementById("pinInput").value="●".repeat(currentPin.length);sndClick();} }
      function doLogin(pin) {
        if(!pin){toast("⚠️ أدخل الكود","error");return false;}
        const p=pin.toString();
        // PINs are already decrypted on load, compare directly
        if(p===(db.manager.pin||"").toString()){loginOk({type:"manager",...db.manager});return true;}
        const w=db.workers.find(w=>(w.pin||"").toString()===p);
        if(w){loginOk({type:"worker",...w});return true;}
        sndErr(); toast("❌ كود خاطئ","error"); return false;
      }
      function verifyLoginDirect() { if(!doLogin(document.getElementById("pinInputDirect").value.trim())) document.getElementById("pinInputDirect").value=""; }
      function verifyLoginPad() { if(!doLogin(currentPin)) clearPin(); }
      function loginOk(user) {
        db.currentUser=user; saveData();
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("mainApp").classList.remove("hidden");
        document.getElementById("sidebarShopName").textContent=db.shopName;
        document.getElementById("currentUserDisplay").innerHTML=`<strong class="text-pink-300">${user.name}</strong><br><small class="text-purple-400">${user.type==="manager"?"👑 مدير":"👤 موظف"}</small>`;
        if(db.autoSyncEnabled&&db.googleSheetURL) startAutoSync();
        activePage=0; buildSidebar(); loadPage(0);
      }
      function logout() { if(confirm("تسجيل خروج؟")){stopAutoSync();db.currentUser=null;saveData();location.reload();} }

      // ====================== LOAD PAGE ======================
      function loadPage(pg) {
        activePage=pg;
        const c=document.getElementById("mainContent"); c.innerHTML=""; c.scrollTop=0;
        // Hide admin-only pages from non-managers
        const isManager = db.currentUser?.type === "manager";
        if(pg===7 && !isManager){toast("للمدير فقط","error");loadPage(0);return;}
        if(pg===5 && !isManager){toast("للمدير فقط","error");loadPage(0);return;}
        if(pg===6 && !isManager){toast("للمدير فقط","error");loadPage(0);return;}
        switch(pg){case 0:pgPOS(c);break;case 1:pgProducts(c);break;case 2:pgDebts(c);break;case 3:pgSuppliers(c);break;case 4:pgReports(c);break;case 5:pgCash(c);break;case 6:pgSync(c);break;case 7:pgManager(c);break;}
      }

      // ====================== POS ======================
      function pgPOS(c) {
        c.innerHTML=`<div class="mb-4"><h1 class="text-2xl font-bold" style="background:linear-gradient(135deg,#be185d,#9333ea);-webkit-background-clip:text;color:transparent;">🎁 نقطة البيع</h1></div>
        <div class="pos-grid">
          <div class="gift-card p-4">
            <input type="text" id="barcodeInput" placeholder="🔍 باركود أو اسم المنتج..." class="w-full p-3 border-2 border-dashed border-pink-300 rounded-2xl mb-3 focus:outline-none focus:border-pink-500 bg-pink-50" onkeypress="if(event.key==='Enter'){handleBarcode(this.value);this.value='';}" />
            <div id="cartItems" class="max-h-64 overflow-auto mb-3"></div>
            <div class="rounded-2xl p-3 mb-3" style="background:linear-gradient(135deg,#fdf2f8,#f3e8ff);">
              <div class="flex justify-between items-center">
                <span class="font-bold text-gray-700">💳 الإجمالي</span>
                <span id="totalAmount" class="text-2xl font-black" style="color:#be185d;">0 ${CURRENCY}</span>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="completeSale(false)" class="btn py-4 text-white rounded-2xl font-bold shadow-lg" style="background:linear-gradient(135deg,#10b981,#059669);">✅ نقدي</button>
              <button onclick="completeSale(true)" class="btn py-4 text-white rounded-2xl font-bold shadow-lg" style="background:linear-gradient(135deg,#f59e0b,#d97706);">📝 دين</button>
            </div>
          </div>
          <div class="gift-card p-4">
            <h3 class="font-bold mb-3 text-gray-700"><i class="fa-solid fa-bolt text-yellow-500"></i> اختيار سريع</h3>
            <div class="quick-grid max-h-96 overflow-auto" id="quickProducts"></div>
          </div>
        </div>`;
        renderQuick(); renderCart();
        setTimeout(()=>document.getElementById("barcodeInput")?.focus(),200);
      }

      function renderQuick() {
        const c=document.getElementById("quickProducts"); if(!c)return; c.innerHTML="";
        db.products.forEach(p => {
          const d=document.createElement("div");
          d.className = `product-quick-card p-2 sm:p-3 ${p.stock<=0?'out-of-stock':''}`;
          d.innerHTML=`<div class="text-xl mb-1">${CAT_EMOJI[p.category]||"🎁"}</div><div class="font-semibold text-xs mb-1 text-gray-800 truncate">${p.name}</div><div class="font-black text-sm" style="color:#be185d;">${p.retail} ${CURRENCY}</div><div class="text-xs ${p.stock<10?'text-red-500':'text-gray-400'} mt-0.5">مخزون: ${p.stock}</div>`;
          if(p.stock>0) d.onclick=()=>{addToCart(p);sndClick();};
          c.appendChild(d);
        });
      }

      function addToCart(product) {
        if(product.stock<=0){sndErr();toast("⚠️ غير متوفر","error");return;}
        const ex=cart.find(i=>i.id===product.id);
        if(ex){if(ex.qty<product.stock)ex.qty++;else{sndErr();toast("⚠️ مخزون غير كافي","error");return;}}
        else cart.push({id:product.id,name:product.name,retail:product.retail,cost:product.cost||0,qty:1});
        renderCart();
      }

      function renderCart() {
        const c=document.getElementById("cartItems"); if(!c)return;
        if(cart.length===0){c.innerHTML=`<div class="text-center py-6 text-gray-400"><div class="text-4xl mb-2">🛍️</div><p class="text-sm">السلة فارغة</p></div>`;document.getElementById("totalAmount").textContent=`0 ${CURRENCY}`;return;}
        let h='<div class="space-y-2">';
        cart.forEach((item,i) => {
          const t=n(item.retail)*item.qty;
          h+=`<div class="flex justify-between items-center p-2.5 rounded-xl" style="background:linear-gradient(135deg,#fdf2f8,#f3e8ff);">
            <div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate">${item.name}</div><div class="text-xs text-gray-500">${item.retail} × ${item.qty} = <strong style="color:#be185d;">${t.toFixed(0)} ${CURRENCY}</strong></div></div>
            <div class="flex items-center gap-1 mr-2 flex-shrink-0">
              <button onclick="chgQty(${i},-1)" class="btn w-6 h-6 rounded-full flex items-center justify-center font-bold text-white text-xs" style="background:#be185d;">-</button>
              <span class="font-bold w-5 text-center text-sm">${item.qty}</span>
              <button onclick="chgQty(${i},1)" class="btn w-6 h-6 rounded-full flex items-center justify-center font-bold text-white text-xs" style="background:#9333ea;">+</button>
              <button onclick="rmCart(${i})" class="btn w-6 h-6 rounded-full flex items-center justify-center text-red-500 bg-transparent text-xs"><i class="fa-solid fa-trash"></i></button>
            </div></div>`;
        });
        h+='</div>'; c.innerHTML=h;
        document.getElementById("totalAmount").textContent = cart.reduce((s,i)=>s+n(i.retail)*i.qty,0).toFixed(0)+` ${CURRENCY}`;
      }

      function chgQty(i,d) { const item=cart[i],p=db.products.find(x=>x.id===item.id); if(d>0&&p&&item.qty>=p.stock){sndErr();return;} item.qty+=d; if(item.qty<=0)cart.splice(i,1); sndClick(); renderCart(); }
      function rmCart(i) { cart.splice(i,1); renderCart(); }
      function handleBarcode(v) { if(!v)return; v=v.trim(); const p=db.products.find(x=>x.barcode===v)||db.products.find(x=>x.name.includes(v)); if(p){addToCart(p);sndClick();}else{sndErr();toast("❌ غير موجود","error");} }

      function completeSale(isDebt) {
        if(cart.length===0){sndErr();toast("السلة فارغة","error");return;}
        const total=cart.reduce((s,i)=>s+n(i.retail)*i.qty,0);
        
        // Show change calculation popup for cash sales
        if(!isDebt) {
          showChangePopup(total, () => {
            // Confirmed - proceed with sale
            finalizeSale(false, total);
          });
          return;
        }
        
        // For debt sales, show the debt modal directly
        document.getElementById("debtAmount").value=total.toFixed(2);
        document.getElementById("debtCustomer").value="";
        document.getElementById("debtPhone").value="";
        openModal("debtModal");
      }
      
      function showChangePopup(total, onConfirm) {
        const modal = document.createElement('div');
        modal.className = 'modal show';
        modal.id = 'changePopup';
        modal.innerHTML = `
          <div class="modal-content">
            <div class="p-4 sm:p-6 rounded-t-3xl flex justify-between items-center" style="background:linear-gradient(135deg,#10b981,#059669)">
              <h3 class="text-lg font-bold text-white">💰 حساب الباقي</h3>
              <button onclick="closeChangePopup()" class="btn text-white text-2xl bg-transparent">&times;</button>
            </div>
            <div class="p-4 sm:p-6">
              <div class="text-center mb-4">
                <div class="text-sm text-gray-600 mb-1">المبلغ المطلوب</div>
                <div class="text-3xl font-black" style="color:#10b981;">${total.toFixed(2)} ${CURRENCY}</div>
              </div>
              <div class="mb-4">
                <label class="block text-sm font-semibold mb-2 text-gray-700">ما هو المبلغ المستلم؟</label>
                <input type="number" id="receivedAmount" step="0.01" inputmode="decimal" 
                  class="w-full p-4 text-center text-2xl border-2 border-green-200 rounded-2xl focus:border-green-500 outline-none bg-green-50 font-bold"
                  placeholder="0.00" oninput="calculateChange(${total})" />
              </div>
              <div id="changeResult" class="hidden mb-4 p-4 rounded-2xl bg-blue-50 border-2 border-blue-200">
                <div class="text-sm text-blue-700 mb-1">الباقي للعميل</div>
                <div id="changeValue" class="text-3xl font-black text-blue-600">0.00 ${CURRENCY}</div>
              </div>
              <div class="flex gap-3 mt-6">
                <button onclick="closeChangePopup()" class="btn flex-1 py-3 bg-gray-100 rounded-xl font-semibold text-gray-700">إلغاء</button>
                <button onclick="confirmSale()" class="btn flex-1 py-3 bg-green-600 text-white rounded-xl font-bold shadow-lg">✅ تأكيد وطباعة</button>
              </div>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
        setTimeout(() => document.getElementById('receivedAmount')?.focus(), 100);
        window.confirmSaleCallback = onConfirm;
      }
      
      function closeChangePopup() {
        const modal = document.getElementById('changePopup');
        if (modal) {
          modal.remove();
        }
        window.confirmSaleCallback = null;
      }
      
      function calculateChange(total) {
        const received = parseFloat(document.getElementById('receivedAmount').value) || 0;
        const resultDiv = document.getElementById('changeResult');
        const changeValue = document.getElementById('changeValue');
        
        if (received >= total && received > 0) {
          const change = received - total;
          changeValue.textContent = change.toFixed(2) + ' ' + CURRENCY;
          resultDiv.classList.remove('hidden');
          resultDiv.className = 'mb-4 p-4 rounded-2xl bg-green-50 border-2 border-green-200';
        } else if (received > 0) {
          changeValue.textContent = 'غير كافٍ';
          resultDiv.classList.remove('hidden');
          resultDiv.className = 'mb-4 p-4 rounded-2xl bg-red-50 border-2 border-red-200';
        } else {
          resultDiv.classList.add('hidden');
        }
      }
      
      function confirmSale() {
        const received = parseFloat(document.getElementById('receivedAmount').value) || 0;
        const total = cart.reduce((s,i)=>s+n(i.retail)*i.qty,0);
        
        if (received < total) {
          toast('⚠️ المبلغ غير كافٍ', 'error');
          return;
        }
        
        closeChangePopup();
        if (window.confirmSaleCallback) {
          window.confirmSaleCallback();
        }
      }
      
      function finalizeSale(isDebt, total) {
        const saleItems=cart.map(c=>({id:c.id,name:c.name,retail:c.retail,cost:c.cost||0,qty:c.qty}));
        const sellerId = db.currentUser?.id || 'manager';
        const sale={id:db.nextInvoice++,date:new Date().toISOString(),total,cashier:db.currentUser.name,sellerId:sellerId,items:saleItems};
        db.sales.push(sale);
        // Update last activity for the seller
        if (db.currentUser) {
          if (db.currentUser.type === 'manager') {
            db.manager.lastActivity = new Date().toISOString();
          } else {
            const worker = db.workers.find(w => w.id === sellerId);
            if (worker) worker.lastActivity = new Date().toISOString();
          }
        }
        addTx("in",`بيع نقدي #${sale.id}`,total);
        cart.forEach(item=>{const p=db.products.find(x=>x.id===item.id);if(p)p.stock-=item.qty;});
        cart=[]; saveData();
        if(db.googleSheetURL)syncUp(true);
        sndOk(); toast(`✅ فاتورة #${sale.id} - ${total.toFixed(0)} ${CURRENCY}`);
        printReceipt(sale.items,total,sale.id);
        loadPage(0);
      }

      function saveDebt(e) {
        e.preventDefault();
        const cust=document.getElementById("debtCustomer").value.trim(),phone=document.getElementById("debtPhone").value.trim(),amt=n(document.getElementById("debtAmount").value);
        if(!cust){toast("أدخل اسم المدين","error");return;}
        if(amt<=0){toast("مبلغ غير صالح","error");return;}
        const saleItems=cart.map(c=>({id:c.id,name:c.name,retail:c.retail,cost:c.cost||0,qty:c.qty}));
        const sellerId = db.currentUser?.id || 'manager';
        db.debts.push({id:Date.now(),customer:cust,phone,amount:amt,paid:0,remaining:amt,date:new Date().toISOString(),items:cart.map(c=>`${c.name}×${c.qty}`).join(", ")});
        db.sales.push({id:db.nextInvoice++,date:new Date().toISOString(),total:amt,cashier:db.currentUser.name,sellerId:sellerId,type:"debt",items:saleItems});
        // Update last activity for the seller
        if (db.currentUser) {
          if (db.currentUser.type === 'manager') {
            db.manager.lastActivity = new Date().toISOString();
          } else {
            const worker = db.workers.find(w => w.id === sellerId);
            if (worker) worker.lastActivity = new Date().toISOString();
          }
        }
        cart.forEach(item=>{const p=db.products.find(x=>x.id===item.id);if(p)p.stock-=item.qty;});
        cart=[]; saveData();
        if(db.googleSheetURL)syncUp(true);
        closeModal("debtModal"); sndOk(); toast(`✅ دين ${amt.toFixed(0)} ${CURRENCY} - ${cust}`);
        loadPage(0);
      }

      function printReceipt(items,total,num) {
        try {
          const receiptHTML = `
            <div style="width:280px;margin:auto;">
              <div style="text-align:center;font-size:18px;font-weight:bold;margin-bottom:6px;">🎁 ${db.shopName}</div>
              <div style="text-align:center;margin-bottom:8px;">فاتورة #${num}<br><span style="font-size:11px;">${new Date().toLocaleString("ar-DZ")}</span></div>
              <hr>
              ${items.map(i=>`<div style="display:flex;justify-content:space-between;margin:5px 0;"><span>${i.name} × ${i.qty}</span><span>${(n(i.retail)*i.qty).toFixed(0)}</span></div>`).join("")}
              <hr style="margin:8px 0;">
              <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:15px;"><span>الإجمالي</span><span>${total.toFixed(0)} ${CURRENCY}</span></div>
              <div style="text-align:center;margin-top:12px;font-size:11px;">شكراً لتسوقكم 🎀</div>
            </div>
          `;
          
          // Always use autoPrintReceipt for silent printing without popup
          autoPrintReceipt(receiptHTML);
        } catch(e) {}
      }

      // ====================== PRODUCTS ======================
      function pgProducts(c) {
        let h=`<div class="flex flex-col sm:flex-row justify-between gap-3 mb-5"><h1 class="text-2xl font-bold" style="background:linear-gradient(135deg,#be185d,#9333ea);-webkit-background-clip:text;color:transparent;">🎁 المنتجات (${db.products.length})</h1><button onclick="openProductModal()" class="btn-primary px-5 py-2.5 text-sm">➕ منتج جديد</button></div><div class="grid gap-3">`;
        if(db.products.length===0) h+=`<div class="text-center py-16 text-gray-400"><div class="text-5xl mb-4">📦</div><p>لا توجد منتجات</p></div>`;
        else db.products.forEach(p=>{
          const pct=n(p.cost)>0?((n(p.retail)-n(p.cost))/n(p.cost)*100).toFixed(0):0;
          h+=`<div class="gift-card p-4 flex flex-col sm:flex-row justify-between gap-2">
            <div class="flex items-start gap-3 flex-1 min-w-0">
              <div class="text-3xl flex-shrink-0">${CAT_EMOJI[p.category]||"🎁"}</div>
              <div class="flex-1 min-w-0"><div class="font-bold text-gray-800 mb-1 truncate">${p.name}</div>
                <div class="flex flex-wrap gap-1 text-xs"><span class="bg-pink-100 text-pink-700 px-2 py-0.5 rounded-full">${p.category}</span><span class="${p.stock<10?'bg-red-100 text-red-700':'bg-purple-100 text-purple-700'} px-2 py-0.5 rounded-full">مخزون: ${p.stock}</span><span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full">ربح: ${pct}%</span></div>
                <div class="mt-1 text-xs text-gray-500">تكلفة: ${n(p.cost)} | جملة: ${n(p.wholesale)} | <strong style="color:#be185d;">تجزئة: ${n(p.retail)} ${CURRENCY}</strong></div>
              </div>
            </div>
            <div class="flex gap-2 flex-shrink-0"><button onclick="openProductModal(${p.id})" class="btn text-purple-600 px-3 py-1.5 border-2 border-purple-200 rounded-xl text-xs bg-white">✏️</button><button onclick="delProduct(${p.id})" class="btn text-red-600 px-3 py-1.5 border-2 border-red-200 rounded-xl text-xs bg-white">🗑️</button></div>
          </div>`;
        });
        c.innerHTML=h+'</div>';
      }

      function openProductModal(id=null) {
        if(id){const p=db.products.find(x=>x.id===id);if(!p)return;document.getElementById("modalProductTitle").textContent="✏️ تعديل";document.getElementById("prodId").value=p.id;document.getElementById("prodName").value=p.name;document.getElementById("prodBarcode").value=p.barcode||"";document.getElementById("prodCategory").value=p.category;document.getElementById("prodUnit").value=p.unit||"piece";document.getElementById("prodStock").value=p.stock;document.getElementById("prodCost").value=p.cost||"";document.getElementById("prodWholesale").value=p.wholesale||"";document.getElementById("prodRetail").value=p.retail;}
        else{document.getElementById("modalProductTitle").textContent="🎁 إضافة منتج";document.getElementById("productForm").reset();document.getElementById("prodId").value="";}
        openModal("productModal");
      }

      function saveProduct(e) {

        const id=document.getElementById("prodId").value;

      function payDebt(id) {
        const d=db.debts.find(x=>x.id===id);if(!d)return;

        d.paid+=amt;d.remaining-=amt;addTx("in",`دفع دين - ${d.customer}`,amt);
        if(d.remaining<=0){db.debts=db.debts.filter(x=>x.id!==id);toast("🎉 سداد كامل!");}else toast(`✅ دفعة ${amt} - متبقي ${d.remaining.toFixed(0)}`);

      // PDF Report Generation with Charts - French
      async function generatePDFReport() {
        if(db.currentUser?.type!=="manager"){toast("للمدير فقط","error");return;}
        
        toast("🔄 Création du rapport...", "info", 3000);
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
        
        // Add Arabic font support (using default for now)
        doc.setFontSize(18);
        doc.text('Rapport Complet - ' + db.shopName, 105, 20, null, null, 'center');
        doc.setFontSize(10);
        doc.text('Date du rapport: ' + new Date().toLocaleString('fr-DZ'), 105, 28, null, null, 'center');
        
        // Summary statistics
        const totalSales = db.sales.reduce((s,x)=>s+parseFloat(x.total),0);
        const totalCost = db.sales.reduce((s,x)=>s+(x.items||[]).reduce((si,i)=>si+(i.cost||0)*i.qty,0),0);
        const profit = totalSales - totalCost;
        const totalDebts = db.debts.reduce((s,x)=>s+parseFloat(x.remaining||0),0);
        const totalPurchases = db.suppliers.reduce((s,x)=>s+parseFloat(x.totalPurchases||0),0);
        
        let y = 40;
        doc.setFillColor(236, 72, 153);
        doc.rect(20, y-5, 170, 8, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(12);
        doc.text('Résumé des Performances', 105, y, null, null, 'center');
        
        y += 15;
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(10);
        const stats = [
          ['Ventes Totales', totalSales.toFixed(2) + ' DZD'],
          ['Bénéfice Net', profit.toFixed(2) + ' DZD'],
          ['Marge Bénéficiaire', (totalSales>0?((profit/totalSales)*100).toFixed(1):0) + '%'],
          ['Dettes Restantes', totalDebts.toFixed(2) + ' DZD'],
          ['Nombre de Factures', db.sales.length.toString()],
          ['Nombre de Produits', db.products.length.toString()],
          ['Nombre d\'Employés', db.workers.length.toString()],
          ['Solde de Caisse', db.cashRegister.toFixed(2) + ' DZD']
        ];
        
        doc.autoTable({
          startY: y,
          head: [['Description', 'Valeur']],
          body: stats,
          theme: 'striped',
          headStyles: { fillColor: [190, 24, 93] },
          styles: { fontSize: 9, cellPadding: 2 },
          columnStyles: { 0: { fontStyle: 'bold' } }
        });
        
        // Top products
        const ps={};db.sales.forEach(s=>(s.items||[]).forEach(i=>{if(!ps[i.name])ps[i.name]={qty:0,total:0};ps[i.name].qty+=i.qty;ps[i.name].total+=parseFloat(i.retail)*i.qty;}));
        const top5=Object.entries(ps).sort((a,b)=>b[1].qty-a[1].qty).slice(0,5);
        
        if(top5.length > 0) {
          doc.addPage();
          doc.setFillColor(16, 185, 129);
          doc.rect(20, 20-5, 170, 8, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(12);
          doc.text('Top 5 Produits Vendus', 105, 20, null, null, 'center');
          
          doc.setTextColor(0, 0, 0);
          doc.autoTable({
            startY: 25,
            head: [['Rang', 'Produit', 'Quantité', 'Total']],
            body: top5.map((p,i)=>[(i+1).toString(), p[0], p[1].qty.toString(), p[1].total.toFixed(2) + ' DZD']),
            theme: 'striped',
            headStyles: { fillColor: [16, 185, 129] },
            styles: { fontSize: 9 }
          });
        }
        
        // Employee performance
        if(db.workers.length > 0 && db.sales.length > 0) {
          doc.addPage();
          doc.setFillColor(59, 130, 246);
          doc.rect(20, 20-5, 170, 8, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(12);
          doc.text('Performance des Employés', 105, 20, null, null, 'center');
          
          const empStats = {};
          db.sales.forEach(s => {
            if(!empStats[s.cashier]) empStats[s.cashier] = { count: 0, total: 0 };
            empStats[s.cashier].count++;
            empStats[s.cashier].total += parseFloat(s.total);
          });
          
          doc.setTextColor(0, 0, 0);
          doc.autoTable({
            startY: 25,
            head: [['Employé', 'Ventes', 'Total Ventes']],
            body: Object.entries(empStats).map(([name, data]) => [name, data.count.toString(), data.total.toFixed(2) + ' DZD']),
            theme: 'striped',
            headStyles: { fillColor: [59, 130, 246] },
            styles: { fontSize: 9 }
          });
        }
        
        // Low stock alert
        const low=db.products.filter(p=>p.stock<10);
        if(low.length > 0) {
          doc.addPage();
          doc.setFillColor(239, 68, 68);
          doc.rect(20, 20-5, 170, 8, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(12);
          doc.text('⚠️ Stock Faible', 105, 20, null, null, 'center');
          
          doc.setTextColor(0, 0, 0);
          doc.autoTable({
            startY: 25,
            head: [['Produit', 'Stock Actuel']],
            body: low.map(p => [p.name, p.stock.toString()]),
            theme: 'striped',
            headStyles: { fillColor: [239, 68, 68] },
            styles: { fontSize: 9 }
          });
        }
        
        // Save PDF
        doc.save(`Rapport_${db.shopName}_${new Date().toISOString().slice(0,10)}.pdf`);
        toast("✅ Rapport PDF téléchargé", "success", 3000);
      }

      async function syncUp(silent=false) {
        if(!db.googleSheetURL){if(!silent)toast("⚠️ لا رابط","error");return;}
        const st=document.getElementById("syncStatus");
        if(st)st.innerHTML=`<div class="sync-loading">🔄 جاري...</div>`;
        try {
          // No encryption - send PINs as plain text for cross-device compatibility
          const payload = {
            action: "sync",
            shopName: db.shopName || "متجر الهدايا الذهبي",
            manager: {
              name: db.manager?.name || "",
              pin: db.manager?.pin || "", // Plain text PIN
              phone: db.manager?.phone || ""
            },
            cashRegister: db.cashRegister || 0,
            nextInvoice: db.nextInvoice || 1001,
            products: (db.products || []).map(p => ({
              id: p.id, name: p.name || "", barcode: p.barcode || "",
              cost: n(p.cost), retail: n(p.retail), wholesale: n(p.wholesale),
              stock: p.stock || 0, category: p.category || "", unit: p.unit || "piece"
            })),
            sales: (db.sales || []).map(s => ({
              id: s.id, date: s.date || "", total: n(s.total),
              cashier: s.cashier || "", type: s.type || "cash",
              items: s.items || []
            })),
            debts: (db.debts || []).map(d => ({
              id: d.id, customer: d.customer || "", phone: d.phone || "",
              amount: n(d.amount), paid: n(d.paid), remaining: n(d.remaining),
              date: d.date || "", items: d.items || ""
            })),
            suppliers: (db.suppliers || []).map(s => ({
              id: s.id, name: s.name || "", phone: s.phone || "",
              address: s.address || "", totalPurchases: n(s.totalPurchases)
            })),
            workers: (db.workers || []).map(w => ({
              id: w.id, name: w.name || "", phone: w.phone || "",
              pin: w.pin || "", role: w.role || "موظف" // Plain text PIN
            })),
            purchases: (db.purchases || []).map(p => ({
              id: p.id, supplierId: p.supplierId, supplierName: p.supplierName || "",
              amount: n(p.amount), notes: p.notes || "", date: p.date || ""
            })),
            transactions: (db.transactions || []).map(t => ({
              id: t.id, date: t.date || "", type: t.type || "",
              description: t.description || "", amount: n(t.amount),
              balanceAfter: n(t.balanceAfter), user: t.user || ""
            })),
            timestamp: new Date().toISOString()
          };
          await fetch(db.googleSheetURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            mode: "no-cors"
          });
          db.lastSyncTime = new Date().toISOString();
          saveData();
          if(st) st.innerHTML=`<div class="sync-success">✅ تمت المزامنة</div>`;
          if(!silent) toast("✅ تمت المزامنة");
          updateSyncInd();
        } catch(err) {
          if(st) st.innerHTML=`<div class="sync-error">❌ فشل: ${err.message}</div>`;
          if(!silent) toast("❌ فشلت المزامنة","error");
        }
      }

      async function syncDown(silent=false) {
        if(!db.googleSheetURL){if(!silent)toast("⚠️ لا رابط","error");return;}
        const st=document.getElementById("syncStatus");
        if(st)st.innerHTML=`<div class="sync-loading">📥 تحميل...</div>`;
        try {
          const r=await fetch(db.googleSheetURL+"?action=get");const d=await r.json();
          if(d.status==="success"&&d.hasData){
            if(!silent && !confirm(`استبدال البيانات؟\n${(d.products||[]).length} منتج | ${(d.sales||[]).length} عملية`)){if(st)st.innerHTML=`<div class="sync-error">تم الإلغاء</div>`;return;}
            if(d.shopName)db.shopName=d.shopName;
            if(d.manager?.name){
              // No decryption needed - PINs are now plain text
              db.manager={name:d.manager.name,pin:d.manager.pin||"",phone:d.manager.phone||""};
            }
            if(d.cashRegister!==undefined)db.cashRegister=n(d.cashRegister);
            ["products","sales","debts","suppliers","workers","purchases","transactions"].forEach(k=>{
              if(d[k]){
                db[k]=d[k];
                // Worker PINs are already plain text - no decryption needed
              }
            });
            if(d.nextInvoice)db.nextInvoice=d.nextInvoice;
            db.lastSyncTime=new Date().toISOString();saveData();
            if(st)st.innerHTML=`<div class="sync-success">✅ تم التحميل!</div>`;
            if(!silent){toast("✅ تم تحميل البيانات");loadPage(activePage);}
            else{loadPage(activePage);}
          }else{if(!silent){if(st)st.innerHTML=`<div class="sync-error">⚠️ لا بيانات</div>`;toast("لا بيانات","error");}}
        }catch(err){if(!silent){if(st)st.innerHTML=`<div class="sync-error">❌ ${err.message}</div>`;toast("❌ فشل","error");}}
      }

      function toggleAuto(on){db.autoSyncEnabled=on;saveData();if(on){startAutoSync();toast("✅ تلقائي مفعّل");}else{stopAutoSync();toast("⏸️ موقف","info");}}
      let syncDownInterval = null;
      function startAutoSync(){
        stopAutoSync();
        if(db.googleSheetURL){
          // Sync up every 1 second for live data
          syncInterval=setInterval(()=>syncUp(true),1000);
          // Also sync down every 1 second to get updates from other devices
          syncDownInterval=setInterval(()=>syncDown(true),1000);
        }
        updateSyncInd();
      }
      function stopAutoSync(){if(syncInterval){clearInterval(syncInterval);syncInterval=null;}if(syncDownInterval){clearInterval(syncDownInterval);syncDownInterval=null;}}

      // Generate QR Code for auto-configuration - FIXED: Includes encrypted PIN
      function generateQRCode() {
        if(!db.googleSheetURL){toast("Configurez d'abord le lien Google Sheets","error");return;}
        
        const configData = {
          shopName: db.shopName,
          managerName: db.manager?.name,
          managerPin: db.manager?.pin, // Plain text PIN now - no encryption
          googleSheetURL: db.googleSheetURL,
          autoSyncEnabled: db.autoSyncEnabled,
          workers: (db.workers || []).map(w => ({ name: w.name, pin: w.pin, role: w.role })) // Workers with plain text PINs
        };
        
        const configStr = JSON.stringify(configData);
        const encodedData = btoa(encodeURIComponent(configStr));
        const qrUrl = `${location.origin}${location.pathname}?config=${encodedData}`;
        
        // Create modal with QR code
        const modal = document.createElement('div');
        modal.className = 'modal show';
        modal.id = 'qrModal';
        modal.innerHTML = `
          <div class="modal-content">
            <div class="p-4 sm:p-6 rounded-t-3xl flex justify-between items-center" style="background:linear-gradient(135deg,#be185d,#9333ea)">
              <h3 class="text-lg font-bold text-white">📱 Code QR de Configuration</h3>
              <button onclick="document.getElementById('qrModal').remove()" class="btn text-white text-2xl bg-transparent">&times;</button>
            </div>
            <div class="p-4 sm:p-6 text-center">
              <p class="text-sm text-gray-600 mb-4">Scannez ce code avec un autre appareil pour configuration automatique</p>
              <div id="qrcode" class="flex justify-center mb-4"></div>
              <p class="text-xs text-green-600 mb-2">✅ Les mots de passe seront transférés sécurisés</p>
              <button onclick="navigator.clipboard.writeText('${qrUrl}').then(()=>toast('✅ Lien copié'))" class="btn w-full py-3 bg-purple-600 text-white rounded-xl font-bold">📋 Copier le lien</button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
        
        // Generate QR code
        setTimeout(() => {
          new QRCode(document.getElementById('qrcode'), {
            text: qrUrl,
            width: 256,
            height: 256,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
          });
        }, 100);
      }

        try {

          dbData.manager.pin = '123456';

          console.log('Please refresh the page and use PIN: 123456');
          return true;
        } catch(e) {
          console.error('Reset failed:', e);
          return false;
        }

      function saveWorker(e){e.preventDefault();const idx=document.getElementById("workerId").value,pin=document.getElementById("workerPin").value.trim();if(pin.length<4){toast("4 أرقام على الأقل","error");return;}if(pin===db.manager.pin.toString()){toast("مستخدم من المدير","error");return;}const dup=db.workers.find((w,i)=>w.pin.toString()===pin&&i.toString()!==idx);if(dup){toast("مستخدم من موظف آخر","error");return;}const w={id:(idx!==""?db.workers[parseInt(idx)]?.id:null)||Date.now(),name:document.getElementById("workerName").value.trim(),phone:document.getElementById("workerPhone").value.trim(),pin,role:"موظف"};if(idx!=="")db.workers[parseInt(idx)]=w;else db.workers.push(w);saveData();if(db.googleSheetURL)syncUp(true);closeModal("workerModal");toast("✅ تم");loadPage(7);}
